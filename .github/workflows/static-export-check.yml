name: Check GitHub Pages Static Export

on:
  push:
    branches: [github-pages-static]
  workflow_dispatch:

jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build

      - name: Verify static output
        run: test -f out/index.html
